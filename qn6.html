<!DOCTYPE html>
<html>
<body>
    <h2>Days Left Until Next Christmas</h2>
    <h3 id="result"></h3>

    <script>
        let today = new Date();
        let cmas = new Date(today.getFullYear(), 11, 25); // Dec 25

        // If Christmas passed this year, set for next year
        if (today.getMonth() === 11 && today.getDate() > 25) {
            cmas.setFullYear(cmas.getFullYear() + 1);
        }

        let oneDay = 1000 * 60 * 60 * 24;
        let daysLeft = Math.ceil((cmas.getTime() - today.getTime()) / oneDay);

        document.getElementById("result").innerText = daysLeft + " days remaining!";
    </script>
</body>
</html>
