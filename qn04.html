<!DOCTYPE html>
<html>
<body>
    <h2>Capitalize First Letter</h2>
    <input type="text" id="strInput" placeholder="Enter a sentence">
    <button onclick="handleCapitalize()">Convert</button>
    <h3 id="result"></h3>

    <script>
        function capitalizeWords(str) {
            let words = str.split(' ');
            for (let i = 0; i < words.length; i++) {
                if (words[i].length > 0) {
                    words[i] = words[i][0].toUpperCase() + words[i].slice(1);
                }
            }
            return words.join(' ');
        }

        function handleCapitalize() {
            let input = document.getElementById("strInput").value;
            let output = capitalizeWords(input);
            document.getElementById("result").innerText = output;
        }
    </script>
</body>
</html>
